<title>Ficha de Admissão – JL Ramos</title>
<meta name="robots" content="noindex">
<script>
  var FICHA = 'https://script.google.com/macros/s/AKfycbwV78bQ653Twy-73uvJchQ8sfyaJ-4HInlxvNp30OYI9LQpiRl4zqhNiik7POXq2AGM/exec';
  var p = new URLSearchParams(location.search);
  // aceita admissao.jlramos.com.br/leonardo e ?resp=leonardo
  var resp = p.get('resp') || location.pathname.split('/').filter(Boolean)[0] || '';
  resp = resp.toLowerCase().replace(/[^a-z0-9.]/g, '');
  location.replace(FICHA + (resp ? '?resp=' + encodeURIComponent(resp) : ''));
</script>
